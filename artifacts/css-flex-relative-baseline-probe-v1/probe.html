<!doctype html>
<meta charset="utf-8">
<title>Flex relative child baseline probe</title>
<style>
body { margin: 0; font: 16px/24px monospace; }
.host { width: 700px; }
.host.flex { display: flex; align-items: first baseline; }
.host.flex.last { align-items: last baseline; }
.box { display: inline-flex; vertical-align: baseline; baseline-source: first;
  flex: none; align-items: flex-start; width: 160px; height: 80px; }
.last .box { baseline-source: last; }
.text { flex: none; width: 40px; font: 40px/50px monospace; }
.relative { position: relative; top: var(--offset); }
</style>
<body>
<script>
const rows = [];
for (const layout of ["flex", "inline"]) {
  for (const last of [false, true]) {
    for (const offset of [-10, 0, 10]) {
      const host = document.createElement("div");
      host.className = `host ${layout}${last ? " last" : ""}`;
      host.style.setProperty("--offset", `${offset}px`);
      const target = document.createElement("div");
      const reference = document.createElement("div");
      target.className = reference.className = "box";
      const text = document.createElement("div");
      text.className = "text relative";
      text.textContent = "X";
      const refText = document.createElement("div");
      refText.className = "text";
      refText.textContent = "X";
      target.append(text); reference.append(refText); host.append(target, reference);
      document.body.append(host);
      const measure = () => {
        const a = target.getBoundingClientRect();
        const b = reference.getBoundingClientRect();
        const ta = text.getBoundingClientRect();
        const tb = refText.getBoundingClientRect();
        return {difference: a.top - b.top, targetHeight: a.height, referenceHeight: b.height,
          targetWidth: a.width, referenceWidth: b.width, textOffset: ta.top - a.top,
          referenceTextOffset: tb.top - b.top, textHeight: ta.height, referenceTextHeight: tb.height};
      };
      const before = measure();
      text.classList.remove("relative");
      const normal = measure();
      text.classList.add("relative");
      const restored = measure();
      rows.push({layout, last, offset, before, normal, restored,
        matched: before.difference === 0, expected: 0,
        calibrated: before.targetHeight === 80 && before.referenceHeight === 80 &&
          before.targetWidth === 160 && before.referenceWidth === 160 &&
          before.textHeight === 50 && before.referenceTextHeight === 50 &&
          before.textOffset === offset && before.referenceTextOffset === 0 &&
          normal.difference === 0 && normal.textOffset === 0 &&
          JSON.stringify(before) === JSON.stringify(restored)});
      host.remove();
    }
  }
}
fetch("/result", {method: "POST", body: JSON.stringify({rows})});
</script>

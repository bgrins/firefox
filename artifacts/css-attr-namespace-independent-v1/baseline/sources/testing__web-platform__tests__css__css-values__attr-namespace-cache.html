<!doctype html>
<meta charset="utf-8">
<title>Typed attr namespace identity probe</title>
<link rel="help" href="https://drafts.csswg.org/css-values-5/#attr-substitution">
<style id="probe-sheet">
@namespace a url(urn:attr-observer:a);
@namespace b url(urn:attr-observer:b);
#fixture { width: 100px; }
.target { display: block; margin: 0; padding: 0; border: 0; box-sizing: content-box; }
#typed-width-first { width: attr(a|x type(<length>), 5px); height: attr(b|x type(<length>), 7px); }
#typed-height-first { height: attr(b|x type(<length>), 7px); width: attr(a|x type(<length>), 5px); }
#only-a { width: attr(a|x type(<length>), 5px); height: 7px; }
#only-b { width: 5px; height: attr(b|x type(<length>), 7px); }
#distinct-local-names { width: attr(a|x type(<length>), 5px); height: attr(b|y type(<length>), 7px); }
#same-qualified-name { width: attr(a|x type(<length>), 5px); height: attr(a|x type(<length>), 7px); }
#numeric-units { width: attr(a|n px, 5px); height: attr(b|n px, 7px); }
#null-and-named-distinct { width: attr(z type(<length>), 5px); height: attr(b|x type(<length>), 7px); }
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id="fixture"></div>
<script>
"use strict";

function runAttrNamespaceProbe() {
  const definitions = [
    ["typed-width-first", "13px", "37px", "37px", "37px"],
    ["typed-height-first", "13px", "37px", "13px", "13px"],
    ["only-a", "13px", "7px", "13px", "7px"],
    ["only-b", "5px", "37px", "5px", "37px"],
    ["distinct-local-names", "13px", "37px", "13px", "37px"],
    ["same-qualified-name", "13px", "13px", "13px", "13px"],
    ["numeric-units", "13px", "37px", "13px", "37px"],
    ["null-and-named-distinct", "13px", "37px", "13px", "37px"],
  ];
  const fixture = document.getElementById("fixture");
  for (const [id] of definitions) {
    const target = document.createElement("div");
    target.id = id;
    target.className = "target";
    target.setAttributeNS("urn:attr-observer:a", "a:x", "13px");
    target.setAttributeNS("urn:attr-observer:b", "b:x", "37px");
    target.setAttributeNS("urn:attr-observer:b", "b:y", "37px");
    target.setAttributeNS("urn:attr-observer:a", "a:n", "13");
    target.setAttributeNS("urn:attr-observer:b", "b:n", "37");
    target.setAttribute("z", "13px");
    fixture.append(target);
  }
  const sheet = document.getElementById("probe-sheet").sheet;
  const declarations = Object.fromEntries(Array.from(sheet.cssRules)
    .filter(rule => rule.selectorText?.startsWith("#"))
    .map(rule => [rule.selectorText.slice(1), rule.style.cssText]));
  const rows = definitions.map(([id, width, height, nativeWidth, nativeHeight]) => {
    const target = document.getElementById(id);
    const computed = getComputedStyle(target);
    return {
      id,
      expected: {width, height},
      sourcePrediction: {width: nativeWidth, height: nativeHeight},
      actual: {width: computed.width, height: computed.height},
      pass: computed.width === width && computed.height === height,
      declaration: declarations[id] ?? "",
      attributes: {
        aX: target.getAttributeNS("urn:attr-observer:a", "x"),
        bX: target.getAttributeNS("urn:attr-observer:b", "x"),
        bY: target.getAttributeNS("urn:attr-observer:b", "y"),
        aN: target.getAttributeNS("urn:attr-observer:a", "n"),
        bN: target.getAttributeNS("urn:attr-observer:b", "n"),
        nullZ: target.getAttributeNS(null, "z"),
      },
    };
  });
  return {
    support: {
      typed: CSS.supports("width", "attr(x type(<length>), 5px)"),
      unit: CSS.supports("width", "attr(x px, 5px)"),
      namespaceRules: Array.from(sheet.cssRules)
        .filter(rule => rule.type === CSSRule.NAMESPACE_RULE).map(rule => rule.cssText),
    },
    fixtureWidth: getComputedStyle(fixture).width,
    rows,
  };
}
</script>
<script>
setup({explicit_done: true});
window.addEventListener("load", () => {
  const result = runAttrNamespaceProbe();
  test(() => {
    assert_true(result.support.typed);
    assert_true(result.support.unit);
    assert_equals(result.support.namespaceRules.length, 2);
    assert_equals(result.fixtureWidth, "100px");
  }, "Typed attr syntax and namespace declarations are supported");
  for (const row of result.rows) {
    test(() => {
      assert_not_equals(row.declaration, "");
      assert_equals(row.attributes.aX, "13px");
      assert_equals(row.attributes.bX, "37px");
      assert_equals(row.attributes.bY, "37px");
      assert_equals(row.attributes.aN, "13");
      assert_equals(row.attributes.bN, "37");
      assert_equals(row.attributes.nullZ, "13px");
      assert_equals(row.actual.width, row.expected.width, "width");
      assert_equals(row.actual.height, row.expected.height, "height");
    }, row.id);
  }
  done();
});
</script>

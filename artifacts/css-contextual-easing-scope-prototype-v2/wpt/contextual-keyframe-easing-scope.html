<!doctype html>
<meta charset="utf-8">
<title>Contextual keyframe easing uses the selected keyframes tree scope</title>
<link rel="help" href="https://drafts.csswg.org/css-values-5/#tree-counting">
<link rel="help" href="https://drafts.csswg.org/css-shadow-1/#tree-scoped-reference">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
let serial = 0;
const frame = () => new Promise(resolve => requestAnimationFrame(resolve));

for (const scope of ["same-tree", "outer-part"]) {
  for (const fn of ["sibling-index", "sibling-count"]) {
    promise_test(async t => {
      const id = `scope-host-${++serial}`;
      const name = `scope-easing-${serial}`;
      const host = document.createElement("div");
      host.id = id;
      document.body.append(host);
      t.add_cleanup(() => host.remove());
      const shadow = host.attachShadow({mode: "open"});
      shadow.innerHTML = `<div id="holder"><i></i><div part="target"></div><i></i></div><div id="calibration-holder"><i></i><div data-calibration></div><i></i></div>`;
      const holder = shadow.getElementById("holder");
      const target = holder.children[1];
      const calibrationHolder = shadow.getElementById("calibration-holder");
      const calibration = calibrationHolder.children[1];
      const local = document.createElement("style");
      local.textContent = `[data-calibration] { display: block; margin-left: calc(sibling-index() * 1px); padding-left: calc(sibling-count() * 1px); }`;
      shadow.append(local);
      const outer = document.createElement("style");
      document.head.append(outer);
      t.add_cleanup(() => outer.remove());
      const expression = `steps(calc(1 + ${fn}()), end)`;
      const keyframes = `@keyframes ${name} { from { opacity: 0; animation-timing-function: ${expression}; } to { opacity: 1; } }`;
      if (scope === "same-tree") {
        local.textContent += keyframes;
      } else {
        outer.textContent = keyframes;
      }
      outer.sheet.insertRule(`#${id}::part(target) { color: blue; }`, outer.sheet.cssRules.length);
      target.style.animation = `${name} 1000ms linear both paused`;
      const installedAnimation = target.getAnimations()[0];
      assert_true(!!installedAnimation, "Literal animation structure exists");
      const reference = document.createElement("div");
      document.body.append(reference);
      t.add_cleanup(() => reference.remove());
      const extra = document.createElement("i");
      const calibrationExtra = document.createElement("i");
      const snapshots = [];
      for (const phase of ["initial", "prepend", "restore"]) {
        if (phase === "prepend") {
          holder.prepend(extra);
          calibrationHolder.prepend(calibrationExtra);
        }
        if (phase === "restore") {
          extra.remove();
          calibrationExtra.remove();
        }
        const index = phase === "prepend" ? 3 : 2;
        const count = phase === "prepend" ? 4 : 3;
        const expected = scope === "outer-part" ? 1 : fn === "sibling-index" ? index : count;
        const animation = target.getAnimations()[0];
        assert_true(!!animation, "Literal animation structure exists");
        await animation.ready;
        animation.currentTime = 750;
        const literal = reference.animate([
          {opacity: 0, easing: `steps(${1 + expected}, end)`}, {opacity: 1}
        ], {duration: 1000, fill: "both"});
        t.add_cleanup(() => literal.cancel());
        literal.pause();
        await literal.ready;
        literal.currentTime = 750;
        await frame();
        await frame();
        const style = getComputedStyle(target);
        const calibrationStyle = getComputedStyle(calibration);
        snapshots.push({phase, index, count, sameAnimation: animation === installedAnimation,
          supported: CSS.supports("animation-timing-function", expression),
          actualEasing: animation.effect.getKeyframes().find(k => k.computedOffset === 0).easing,
          expectedEasing: literal.effect.getKeyframes().find(k => k.computedOffset === 0).easing,
          actualOpacity: Number(style.opacity), expectedOpacity: Number(getComputedStyle(reference).opacity),
          repeatedOpacity: Number(getComputedStyle(target).opacity),
          indexPixels: parseFloat(calibrationStyle.marginLeft), countPixels: parseFloat(calibrationStyle.paddingLeft)});
        literal.cancel();
      }
      for (const row of snapshots) {
        assert_true(row.sameAnimation, `${row.phase}: original effect remains installed`);
        assert_equals(row.indexPixels, row.index, `${row.phase}: same-tree index calibration`);
        assert_equals(row.countPixels, row.count, `${row.phase}: same-tree count calibration`);
        assert_true(row.supported, `${row.phase}: contextual CSS easing admitted`);
        assert_equals(row.actualEasing, row.expectedEasing, `${row.phase}: selected keyframes scope`);
        assert_approx_equals(row.actualOpacity, row.expectedOpacity, 0.00001, `${row.phase}: sampled output`);
        assert_equals(row.repeatedOpacity, row.actualOpacity, `${row.phase}: stable output`);
      }
    }, `Contextual keyframe easing ${fn} uses ${scope} scope across sibling mutation`);
  }
}
</script>

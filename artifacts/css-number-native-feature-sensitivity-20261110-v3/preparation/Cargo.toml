[package]
name = "css-number-feature-gate"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"

[[bin]]
name = "numeric"
path = "driver.rs"

[dependencies]
cssparser = { git = "https://github.com/servo/rust-cssparser", rev = "9f3ceddf398f5ce4ab76fdad1b42ccb6c578a926", default-features = true }

[profile.dev]
opt-level = 1
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16
incremental = false
panic = "unwind"

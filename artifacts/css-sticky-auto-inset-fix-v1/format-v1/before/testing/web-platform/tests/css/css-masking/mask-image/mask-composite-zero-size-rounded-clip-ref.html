<!doctype html>
<meta charset="utf-8">
<title>Reference: transparent mask with a rounded per-layer clip</title>
<style>
  body { margin: 10px; }
  #grid { display: grid; grid-template-columns: repeat(4, 140px); gap: 10px; }
  .tile { width: 140px; height: 140px; }
  .target {
    width: 40px;
    height: 40px;
    padding: 8px;
    border: 4px solid transparent;
    border-radius: 18px;
    background: green;
    mask-repeat: no-repeat;
    mask-origin: border-box;
    mask-clip: border-box, content-box, border-box;
    transform: translate(6px, 4px) scale(2);
    transform-origin: 0 0;
  }
</style>
<div id="grid"></div>
<script src="support/mask-composite-zero-size-rounded-clip.js"></script>
<script>buildRoundedClipMaskCases(false);</script>

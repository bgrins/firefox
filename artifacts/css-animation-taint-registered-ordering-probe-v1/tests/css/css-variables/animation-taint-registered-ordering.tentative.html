<!doctype html>
<meta charset="utf-8">
<title>Registered keyframe ordering observations</title>
<link rel="help" href="https://drafts.css-houdini.org/css-properties-values-api-1/#registered-custom-properties">
<link rel="help" href="https://drafts.csswg.org/css-variables-1/#animation-tainted">
<meta name="assert" content="Calibration and literal controls accompany independent style-flush, token-equality and opacity-driver observations.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<pre id="observations" hidden></pre>
<script>
"use strict";
window.registeredOrderingObservations = {};

function configuration(mode) {
  if (mode === "literal") return {flush: true, equal: false, opacity: true, literal: true};
  const match = /^flush([01])-equal([01])-opacity([01])$/.exec(mode);
  return {flush: match[1] === "1", equal: match[2] === "1", opacity: match[3] === "1", literal: false};
}

function referenceChecks(record) {
  const checks = [];
  const add = (name, passed) => checks.push({name, passed: Boolean(passed)});
  const config = record ? configuration(record.mode) : null;
  add("complete capture", record?.phases?.length === 2 && record?.calibration != null &&
    record?.registration != null && (!config.flush || record.before != null));
  add("registration initial/inheritance", record?.calibration?.initial === "horizontal-tb");
  add("registration syntax", record?.calibration?.multiIdent === "horizontal-tb");
  if (config?.flush) {
    add("ordinary underlying source", record?.before?.variable === (config.equal ? "vertical-rl" : "vertical-lr"));
  }
  for (const phase of record?.phases ?? []) {
    add(`${phase.label}: fixed driver and identity`, phase.cssDuration === "2s" &&
      phase.duration === 2000 && phase.currentTime === 750 && phase.playState === "paused" &&
      Math.abs(phase.progress - .375) <= .00001 && phase.sameAnimation && phase.sameEffect);
    add(`${phase.label}: active custom source`, phase.variable === "vertical-rl");
    add(`${phase.label}: opacity driver selection`, phase.opacity === (config.opacity ? "1" : "0.25"));
    if (config.literal) {
      add(`${phase.label}: literal sink`, phase.readings.length === 4 &&
        phase.readings.every(value => value === "vertical-lr"));
    }
  }
  return checks;
}

for (const mode of [
  "flush0-equal0-opacity0", "flush0-equal0-opacity1",
  "flush0-equal1-opacity0", "flush0-equal1-opacity1",
  "flush1-equal0-opacity0", "flush1-equal0-opacity1",
  "flush1-equal1-opacity0", "flush1-equal1-opacity1", "literal",
]) {
  promise_test(async t => {
    const config = configuration(mode);
    const record = {mode, registration: null, calibration: null, before: null, phases: []};
    window.registeredOrderingObservations[mode] = record;
    const frame = document.createElement("iframe");
    let animation;
    t.add_cleanup(() => { animation?.cancel(); frame.remove(); });
    const loaded = new Promise(resolve => frame.onload = resolve);
    frame.srcdoc = "<!doctype html><html><head></head><body></body></html>";
    document.body.append(frame);
    await loaded;
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    assert_equals(typeof win.CSS.registerProperty, "function", "Registration API is available");
    const definition = {name: "--v", syntax: "<custom-ident>", inherits: false,
      initialValue: "horizontal-tb"};
    win.CSS.registerProperty(definition);
    record.registration = {...definition, returnedSuccessfully: true};
    const style = doc.createElement("style");
    style.textContent = `
      @keyframes hold { from, to { --v: vertical-rl; ${config.opacity ? "opacity: 1;" : ""} } }
      body { writing-mode: horizontal-tb; }
      #calibration { --v: vertical-lr; }
      #subject { --v: ${config.equal ? "vertical-rl" : "vertical-lr"}; opacity: .25;
        writing-mode: ${config.literal ? "vertical-lr" : "var(--v, vertical-lr)"}; }
      #subject.active { animation: hold 2s linear paused both; }
      #subject.changed { --v: horizontal-tb; }
    `;
    doc.head.append(style);
    doc.body.innerHTML = '<div id="calibration"><div id="child"></div></div>';
    const child = doc.getElementById("child");
    const initial = win.getComputedStyle(child).getPropertyValue("--v").trim();
    child.style.setProperty("--v", "one two");
    const multiIdent = win.getComputedStyle(child).getPropertyValue("--v").trim();
    record.calibration = {initial, multiIdent};
    doc.getElementById("calibration").remove();
    const subject = doc.createElement("div");
    subject.id = "subject";
    doc.body.append(subject);
    if (config.flush) {
      const before = win.getComputedStyle(subject);
      record.before = {variable: before.getPropertyValue("--v").trim(), sink: before.writingMode};
    }
    subject.classList.add("active");
    const animations = subject.getAnimations();
    assert_equals(animations.length, 1, "One CSS animation");
    animation = animations[0];
    const effect = animation.effect;
    await animation.ready;
    animation.currentTime = 750;
    const sample = async label => {
      const readings = [win.getComputedStyle(subject).writingMode];
      for (let i = 0; i < 3; ++i) {
        await new Promise(resolve => win.requestAnimationFrame(resolve));
        readings.push(win.getComputedStyle(subject).writingMode);
      }
      const computed = win.getComputedStyle(subject);
      const members = subject.getAnimations();
      record.phases.push({label, readings,
        variable: computed.getPropertyValue("--v").trim(), opacity: computed.opacity,
        cssDuration: computed.animationDuration, currentTime: animation.currentTime,
        playState: animation.playState, duration: effect.getTiming().duration,
        progress: effect.getComputedTiming().progress,
        sameAnimation: members.length === 1 && members[0] === animation,
        sameEffect: animation.effect === effect});
    };
    await sample("initial");
    subject.classList.add("changed");
    await sample("ordinary-mutation");
    document.getElementById("observations").textContent = JSON.stringify(window.registeredOrderingObservations, null, 2);
    const detail = JSON.stringify(record);
    for (const check of referenceChecks(record)) {
      assert_true(check.passed, `${check.name}: ${detail}`);
    }
  }, `Registered keyframe ordering observation: ${mode}`);
}
</script>

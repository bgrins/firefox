[package]
name = "language_break_provider"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["staticlib"]
[dependencies]
icu_capi = { path = "../provider-crates/icu_capi", default-features = false, features = ["std", "compiled_data", "locale", "properties", "segmenter"] }
[patch.crates-io]
icu_collections = { path = "../provider-crates/icu_collections" }
icu_normalizer = { path = "../provider-crates/icu_normalizer" }
icu_normalizer_data = { path = "../provider-crates/icu_normalizer_data" }
icu_properties = { path = "../provider-crates/icu_properties" }
icu_properties_data = { path = "../provider-crates/icu_properties_data" }
icu_segmenter_data = { path = "../provider-crates/icu_segmenter_data" }
icu_collator = { path = "../provider-crates/icu_collator" }
icu_collator_data = { path = "../provider-crates/icu_collator_data" }

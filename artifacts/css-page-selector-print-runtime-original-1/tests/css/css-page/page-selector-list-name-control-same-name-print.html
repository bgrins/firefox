<!DOCTYPE html>
<meta charset="utf-8">
<title>Page selector name: same-name</title>
<link rel="help" href="https://drafts.csswg.org/css-page-3/#page-selectors">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#cascading-and-page-context">
<link rel="match" href="page-selector-list-name-controls-ref.html">
<meta name="reftest-pages" content="1-2">
<style>
@page { size: 5in 3in; margin: 0; }
html { print-color-adjust: exact; }
body { margin: 0; }
.mark { width: 20px; height: 20px; background: green; }
.next { break-before: page; }
body { page: alpha; }
@page alpha:first, alpha { margin-top: 96px; }
@page alpha:first { margin-top: 0; }
@page alpha { margin-top: 0; }
</style>
<div class="mark"></div><div class="mark next"></div>

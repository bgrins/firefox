<!doctype html>
<meta charset="utf-8">
<title>Zero-size masks preserve rounded per-layer clips</title>
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#the-mask-clip">
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#the-mask-composite">
<link rel="match" href="mask-composite-zero-size-rounded-clip-ref.html">
<meta name="assert" content="A zero-size mask with a rounded content-box clip behaves like a transparent mask and preserves subsequent layer painting.">
<style>
  body { margin: 10px; }
  #grid { display: grid; grid-template-columns: repeat(4, 140px); gap: 10px; }
  .tile { width: 140px; height: 140px; }
  .target {
    width: 40px;
    height: 40px;
    padding: 8px;
    border: 4px solid transparent;
    border-radius: 18px;
    background: green;
    mask-repeat: no-repeat;
    mask-origin: border-box;
    mask-clip: border-box, content-box, border-box;
    transform: translate(6px, 4px) scale(2);
    transform-origin: 0 0;
  }
</style>
<div id="grid"></div>
<script src="support/mask-composite-zero-size-rounded-clip.js"></script>
<script>buildRoundedClipMaskCases(true);</script>

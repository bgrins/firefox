<!doctype html>
<meta charset="utf-8">
<title>CSS Text: lowercase sigma rendering</title>
<link rel="help" href="https://drafts.csswg.org/css-text-3/#text-transform-mapping">
<link rel="match" href="reference/text-transform-lowercase-sigma-context-ref.html">
<style>
  @font-face {
    font-family: SigmaTest;
    src: url("/fonts/GentiumPlus-R.woff") format("woff");
  }
  .row {
    font: 24px/32px SigmaTest;
    white-space: pre;
  }
  .row span {
    display: inline-block;
    width: 240px;
  }
  .actual {
    text-transform: lowercase;
  }
</style>
<p>The two columns must match.</p>
<div class="row" lang="en"><span class="actual">ƻΣ</span><span>ƻσ</span></div>
<div class="row" lang="en"><span class="actual">AΣƻ</span><span>aςƻ</span></div>
<div class="row" lang="en"><span class="actual">AΣ&#x27;A</span><span>aσ&#x27;a</span></div>
<div class="row" lang="en"><span class="actual">AͅΣ</span><span>aͅς</span></div>
<div class="row" lang="en"><span class="actual">AΣͅ</span><span>aςͅ</span></div>
<div class="row" lang="en"><span class="actual">AΣͅA</span><span>aσͅa</span></div>
<div class="row" lang="en"><span class="actual">ⅠΣ</span><span>ⅰς</span></div>
<div class="row" lang="en"><span class="actual">AΣⅠ</span><span>aσⅰ</span></div>
<div class="row" lang="en"><span class="actual">AΣΣ</span><span>aσς</span></div>
<div class="row" lang="en"><span class="actual">ΣΣ</span><span>σς</span></div>
<div class="row" lang="en"><span class="actual">İΣ</span><span>i̇ς</span></div>
<div class="row" lang="en"><span class="actual">AΣİ</span><span>aσi̇</span></div>
<div class="row" lang="tr"><span class="actual">AΣI</span><span>aσı</span></div>
<div class="row" lang="tr"><span class="actual">AΣİ</span><span>aσi</span></div>

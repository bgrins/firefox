<!doctype html>
<meta charset="utf-8">
<title>Overflow continuations with relative offsets and child writing modes</title>
<style>
body { margin: 0; }
.columns { writing-mode: vertical-rl; direction: ltr; inline-size: 200px; block-size: 160px; columns: 100px; column-gap: 0; column-fill: auto; }
.flow { inline-size: 100px; }
.flex { display: flex; align-items: flex-start; }
.row { flex-flow: row wrap; align-content: flex-start; }
.column { flex-direction: column; }
.item { flex: none; width: 80px; height: 100px; min-width: 0; min-height: 0; overflow: visible; }
.item + .item { break-before: always; }
.reference-flow .item + .item { break-before: column; }
.descendant { width: 160px; height: 100px; break-inside: avoid; }
</style>

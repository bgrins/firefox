<!doctype html>
<meta charset="utf-8">
<title>SVG viewport length reads in a skipped iframe</title>
<link rel="help" href="https://svgwg.org/svg2-draft/types.html#InterfaceSVGLength">
<link rel="help" href="https://drafts.csswg.org/css-values-4/#viewport-relative-lengths">
<link rel="help" href="https://drafts.csswg.org/css-contain-2/#content-visibility">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
.host { width: 200px; height: 100px; border: 0; padding: 0; }
.host.wide { width: 400px; }
.host.hidden { content-visibility: hidden; }
iframe { display: block; width: 100%; height: 100%; border: 0; padding: 0; }
</style>
<body>
<script>
"use strict";
const observations = [];
window.hiddenViewportObservations = observations;
async function makeFrame(t, unit, wide) {
  const host = document.createElement("div");
  host.className = wide ? "host wide" : "host";
  const frame = document.createElement("iframe");
  const loaded = new Promise(resolve => { frame.onload = resolve; });
  frame.srcdoc = `<!doctype html><style>html,body{margin:0;overflow:hidden}</style>
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <text id="target" x="10${unit}">x</text></svg>`;
  host.append(frame);
  document.body.append(host);
  t.add_cleanup(() => host.remove());
  await loaded;
  const doc = frame.contentDocument;
  return {host, frame, doc, length: doc.getElementById("target").x.baseVal.getItem(0)};
}
for (const unit of ["vw", "px"]) {
  for (const hidden of [false, true]) {
    promise_test(async t => {
      const subject = await makeFrame(t, unit, false);
      const twin = await makeFrame(t, unit, true);
      const initial = unit === "vw" ? 20 : 10;
      const expected = unit === "vw" ? 40 : 10;
      const twinWidth = twin.frame.getBoundingClientRect().width;
      const twinViewport = twin.doc.documentElement.clientWidth;
      const twinValue = twin.length.value;
      const initialWidth = subject.frame.getBoundingClientRect().width;
      const initialViewport = subject.doc.documentElement.clientWidth;
      const parsed = subject.length.valueAsString;
      const warmed = subject.length.value;
      subject.host.classList.toggle("hidden", hidden);
      const hiddenStyle = getComputedStyle(subject.host).contentVisibility;
      const preResizeHostWidth = subject.host.getBoundingClientRect().width;
      subject.host.classList.add("wide");
      const first = subject.length.value;
      const repeat = subject.length.value;
      const changedHostWidth = subject.host.getBoundingClientRect().width;
      const forcedFrameWidth = subject.frame.getBoundingClientRect().width;
      const forcedViewport = subject.doc.documentElement.clientWidth;
      const afterFrameQuery = subject.length.value;
      subject.host.classList.remove("hidden");
      const revealedWidth = subject.frame.getBoundingClientRect().width;
      const revealedViewport = subject.doc.documentElement.clientWidth;
      const revealed = subject.length.value;
      subject.host.classList.remove("wide");
      const resetWidth = subject.frame.getBoundingClientRect().width;
      const resetViewport = subject.doc.documentElement.clientWidth;
      const reset = subject.length.value;
      observations.push({unit, hidden, first, repeat, changedHostWidth,
        forcedFrameWidth, forcedViewport, afterFrameQuery, revealed, reset});
      assert_equals(twinWidth, 400, "visible twin frame calibration");
      assert_equals(twinViewport, 400, "visible twin viewport calibration");
      assert_equals(twinValue, expected, "visible twin value calibration");
      assert_equals(initialWidth, 200, "initial frame calibration");
      assert_equals(initialViewport, 200, "initial viewport calibration");
      assert_equals(parsed, `10${unit}`, "parsed source calibration");
      assert_equals(warmed, initial, "warmed value calibration");
      assert_equals(hiddenStyle, hidden ? "hidden" : "visible", "skip style calibration");
      assert_equals(preResizeHostWidth, 200, "pre-resize host calibration");
      assert_equals(changedHostWidth, 400, "changed host calibration");
      assert_equals(revealedWidth, 400, "revealed frame calibration");
      assert_equals(revealedViewport, 400, "revealed viewport calibration");
      assert_equals(revealed, expected, "revealed value calibration");
      assert_equals(resetWidth, 200, "reset frame calibration");
      assert_equals(resetViewport, 200, "reset viewport calibration");
      assert_equals(reset, initial, "reset value calibration");
      assert_equals(first, expected, "first value under current-viewport hypothesis");
      assert_equals(repeat, first, "repeat value");
      assert_equals(forcedFrameWidth, 400, "frame query after first read");
      assert_equals(forcedViewport, 400, "viewport after frame query");
      assert_equals(afterFrameQuery, expected, "value after frame query");
    }, `${unit}: ${hidden ? "hidden" : "visible"} iframe provider`);
  }
}
</script>

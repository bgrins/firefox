<!doctype html>
<meta charset="utf-8">
<title>Flex line cross-size sum probe</title>
<style>
  .container {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    align-content: flex-start;
    width: 100px;
    min-height: 0;
    max-height: 100px;
  }
  .item { flex: none; width: 100px; }
</style>
<body>
<script>
const rows = [];
for (const count of [1, 2, 3, 4]) {
  for (const height of [20, 1000000, 6000000, 12000000, 17000000]) {
    for (const gap of [0, 12000000]) {
      const container = document.createElement("div");
      container.className = "container";
      container.style.rowGap = `${gap}px`;
      for (let i = 0; i < count; ++i) {
        const item = document.createElement("div");
        item.className = "item";
        item.style.height = `${height}px`;
        container.append(item);
      }
      document.body.append(container);
      const computed = [...container.children].map(item => ({
        height: parseFloat(getComputedStyle(item).height),
        width: parseFloat(getComputedStyle(item).width),
      }));
      const computedGap = parseFloat(getComputedStyle(container).rowGap);
      const actual = container.getBoundingClientRect().height;
      const expected = Math.min(100, count * height + (count - 1) * gap);
      const calibrated = computed.every(item =>
        Math.abs(item.height - height) <= 2 && item.width === 100) &&
        Math.abs(computedGap - gap) <= 2;
      container.style.height = "100px";
      const definiteControl = container.getBoundingClientRect().height;
      container.style.height = "";
      const restored = container.getBoundingClientRect().height;
      rows.push({count, height, gap, computed, computedGap, actual, expected,
        calibrated, matched: Math.abs(actual - expected) <= 0.02,
        definiteControl, restored, stable: restored === actual});
      container.remove();
    }
  }
}
fetch("/result", {method: "POST", body: JSON.stringify({rows})});
</script>

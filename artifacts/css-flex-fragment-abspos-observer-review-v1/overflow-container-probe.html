<!doctype html>
<meta charset="utf-8">
<title>Overflow continuations beside forced flex items</title>
<style>
body { margin: 0; }
.oc-columns { position: relative; inline-size: 200px; block-size: var(--height); columns: 100px; column-gap: 0; column-fill: auto; }
.oc-flex { display: flex; inline-size: 100px; align-items: flex-start; }
.oc-row { flex-flow: row wrap; align-content: flex-start; }
.oc-column { flex-direction: column; }
.oc-item { flex: none; inline-size: 100px; block-size: 80px; overflow: visible; }
.oc-item + .oc-item { break-before: always; }
.oc-descendant { inline-size: 100px; block-size: 20px; break-inside: avoid; }
.oc-descendant + .oc-descendant { break-before: always; }
.oc-reference { columns: auto; }
.oc-reference > div { position: absolute; inset-inline-start: var(--inline); inset-block-start: 0; inline-size: 100px; block-size: 20px; }
</style>
<body>
<script src="overflow-container-probe.js"></script>

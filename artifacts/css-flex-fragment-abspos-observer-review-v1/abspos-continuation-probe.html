<!doctype html>
<meta charset="utf-8">
<title>Absolute children across flex fragments</title>
<style>
body { margin: 0; }
.abs-columns {
  position: relative;
  inline-size: 200px;
  block-size: var(--column-height);
  columns: 100px;
  column-gap: 0;
  column-fill: auto;
}
.abs-flex {
  position: relative;
  display: flex;
  inline-size: 100px;
  align-items: flex-start;
}
.abs-row { flex-flow: row wrap; align-content: flex-start; }
.abs-column { flex-direction: column; }
.abs-flow-item { flex: none; inline-size: 100px; block-size: 80px; break-inside: avoid; }
.abs-flow-item + .abs-flow-item { break-before: always; }
.abs-subject {
  position: absolute;
  inline-size: 100px;
  inset-inline-start: 0;
  inset-block-start: var(--block-offset);
}
.abs-subject-item { inline-size: 100px; block-size: 80px; break-inside: avoid; }
.abs-subject-item + .abs-subject-item { break-before: always; }
.abs-marker { inline-size: 100px; block-size: 20px; break-inside: avoid; }
.abs-reference { columns: auto; }
.abs-reference-item {
  position: absolute;
  inline-size: 100px;
  block-size: 80px;
  inset-inline-start: var(--reference-inline);
  inset-block-start: var(--reference-block);
}
</style>
<body>

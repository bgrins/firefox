<!doctype html>
<meta charset="utf-8">
<title>Absolute positioning outside a subgrid's existing lines</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#abspos-items">
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#subgrid-implicit">
<meta name="assert" content="Nonexistent lines become auto for absolutely positioned children of a subgrid, while in-flow items are clamped.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
.outer, .container {
  display: grid;
  gap: 0;
}
.outer.column {
  grid-template-columns: 40px 40px;
  grid-template-rows: 20px;
  width: 80px;
  height: 20px;
}
.outer.row {
  grid-template-columns: 20px;
  grid-template-rows: 40px 40px;
  width: 20px;
  height: 80px;
}
.container { position: relative; }
.column > .container {
  grid-column: 1 / 3;
  grid-template-columns: 40px 40px;
}
.row > .container {
  grid-row: 1 / 3;
  grid-template-rows: 40px 40px;
}
.column > .subgrid { grid-template-columns: subgrid; }
.row > .subgrid { grid-template-rows: subgrid; }
.target {
  position: absolute;
  inset: 0;
}
.target.inflow { position: static; }
</style>
<div id="log"></div>
<script>
"use strict";

function checkPlacement(t, axis, subgrid, placement, offset, extent, inflow = false, named = false) {
  const outer = document.createElement("div");
  outer.className = `outer ${axis}`;
  const container = document.createElement("div");
  container.className = `container${subgrid ? " subgrid" : ""}`;
  if (named) {
    outer.style.setProperty(`grid-template-${axis}s`,
      "[outside-before] 40px [edge] 40px [middle] 40px [edge] 40px [outside-after]");
    outer.style.setProperty(axis === "column" ? "width" : "height", "160px");
    container.style.setProperty(`grid-${axis}`, "2 / 4");
    if (!subgrid) {
      container.style.setProperty(`grid-template-${axis}s`,
        "[edge] 40px [middle] 40px [edge]");
    }
  }
  const target = document.createElement("div");
  target.className = `target${inflow ? " inflow" : ""}`;
  target.style.setProperty(`grid-${axis}`, placement);
  assert_not_equals(target.style.getPropertyValue(`grid-${axis}`), "");
  container.append(target);
  outer.append(container);
  document.body.append(outer);
  t.add_cleanup(() => outer.remove());
  const containerRect = container.getBoundingClientRect();
  const targetRect = target.getBoundingClientRect();
  if (axis === "column") {
    assert_equals(containerRect.width, 80, "container width");
    assert_equals(targetRect.left - containerRect.left, offset, "left offset");
    assert_equals(targetRect.width, extent, "width");
  } else {
    assert_equals(containerRect.height, 80, "container height");
    assert_equals(targetRect.top - containerRect.top, offset, "top offset");
    assert_equals(targetRect.height, extent, "height");
  }
}

for (const axis of ["column", "row"]) {
  for (const subgrid of [false, true]) {
    for (const [placement, offset, extent] of [
      ["4 / 5", 0, 80],
      ["-5 / -4", 0, 80],
      ["auto / auto", 0, 80],
      ["2 / 3", 40, 40],
      ["4 / auto", 0, 80],
      ["auto / 5", 0, 80],
      ["1 / 5", 0, 80],
      ["auto / 2", 0, 40],
      ["2 / auto", 40, 40],
      ["5 / 4", 0, 80],
      ["3 / 1", 0, 80],
      ["-4 / -5", 0, 80],
      ["4 / 2", 40, 40],
      ["2 / -4", 0, 40],
      ["4 / span 1", 0, 80],
      ["span 1 / -4", 0, 80],
      ["2 / span 3", 40, 40],
      ["span 3 / 2", 0, 40],
      ["1 / span 2", 0, 80],
      ["span 2 / 3", 0, 80],
      ["2 / span 1", 40, 40],
      ["3 / span 1", 80, 0],
      ["span 1 / 1", 0, 0],
      ["span 1 / 2", 0, 40],
      ["auto / span 2", 0, 80],
      ["span 2 / span 3", 0, 80],
    ]) {
      test(t => {
        checkPlacement(t, axis, subgrid, placement, offset, extent);
      }, `Abspos ${axis}: ${placement} in ${subgrid ? "subgrid" : "ordinary grid"}`);
    }
  }
  for (const subgrid of [false, true]) {
    for (const [placement, offset, extent] of [
      ["edge 1 / edge 2", 0, 80],
      ["edge -2 / edge -1", 0, 80],
      ["middle / edge 2", 40, 40],
      ["edge 2 / middle", 40, 40],
      ["edge 3 / edge 4", 0, 80],
      ["edge -4 / edge -3", 0, 80],
      ["missing 1 / missing 2", 0, 80],
      ["missing -2 / missing -1", 0, 80],
      ["outside-before / auto", 0, 80],
      ["auto / outside-after", 0, 80],
      ["outside-before -1 / auto", 0, 80],
      ["auto / outside-after -1", 0, 80],
      ["middle / span 1 edge", 40, 40],
      ["span 1 edge / middle", 0, 40],
      ["middle / span 2 edge", 40, 40],
      ["span 2 edge / middle", 0, 40],
      ["edge 3 / span 1 edge", 0, 80],
      ["edge 2 / span 1 edge", 80, 0],
      ["span 1 edge / edge 1", 0, 0],
      ["span 1 edge / edge -3", 0, 80],
    ]) {
      test(t => {
        checkPlacement(t, axis, subgrid, placement, offset, extent, false, true);
      }, `Named abspos ${axis}: ${placement} in ${subgrid ? "subgrid" : "ordinary grid"}`);
    }
  }
  for (const [placement, offset, extent] of [
    ["4 / 5", 40, 40],
    ["-5 / -4", 0, 40],
    ["4 / span 2", 40, 40],
    ["span 2 / -4", 0, 40],
    ["2 / span 3", 40, 40],
    ["span 3 / 2", 0, 40],
  ]) {
    test(t => {
      checkPlacement(t, axis, true, placement, offset, extent, true);
    }, `In-flow ${axis}: ${placement} is clamped to the subgrid`);
  }
}
</script>

<!doctype html>
<meta charset="utf-8">
<title>Registered line-height resolves before selected font weight</title>
<link rel="help" href="https://drafts.css-houdini.org/css-properties-values-api-1/#dependency-cycles">
<link rel="help" href="https://drafts.csswg.org/css-values-4/#font-relative-lengths">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
for (const mode of ["lh-selected-metric", "px-selected-control", "lh-literal-weight-control"]) {
  promise_test(async t => {
    const frame = document.createElement("iframe");
    frame.srcdoc = `<!doctype html><link rel="stylesheet" href="/fonts/ahem.css"><style>
      @font-face { font-family: LineMetrics; font-weight: 400; src: url(/fonts/Ahem.ttf); }
      @font-face { font-family: LineMetrics; font-weight: 700; src: url(/fonts/noto/noto-sans-v8-latin-regular.woff); }
    </style><style id="phase-style"></style><body>`;
    const loaded = new Promise(resolve => frame.onload = resolve);
    document.body.append(frame);
    t.add_cleanup(() => frame.remove());
    await loaded;
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    for (const weight of [400, 700]) {
      const faces = await doc.fonts.load(`${weight} 20px LineMetrics`, "0");
      assert_equals(faces.length, 1, "exact selected face");
      assert_equals(faces[0].status, "loaded", "selected face loaded");
    }
    await doc.fonts.ready;
    for (const name of ["--line-length", "--line-metric"]) {
      win.CSS.registerProperty({name, syntax: "<length>", inherits: false, initialValue: "2px"});
    }
    for (const id of ["target", "reference", "normal-reference"]) {
      const element = doc.createElement("div");
      element.id = id;
      doc.body.append(element);
    }
    const target = doc.getElementById("target");
    const phaseStyle = doc.getElementById("phase-style");
    const observations = [];
    for (const size of [20, 30]) {
      const metricTarget = mode === "lh-selected-metric";
      const length = mode === "px-selected-control" ? `${size}px` : "1lh";
      const weight = mode === "lh-literal-weight-control" ? "700" :
        `calc(var(--line-length) / ${size}px * 700)`;
      phaseStyle.textContent = `
        div { font-family: LineMetrics; font-size: ${size}px; line-height: ${size}px; font-style: normal;
          font-stretch: normal; font-size-adjust: none; font-synthesis: none;
          writing-mode: horizontal-tb; text-orientation: mixed; width: 1ch; }
        #target { --line-length: ${length}; ${metricTarget ? "--line-metric: 1ch;" : ""}
          font-weight: ${weight}; }
        #reference { font-weight: 700; }
        #normal-reference { font-weight: 400; }`;
      const samples = [];
      const first = metricTarget ? "--line-metric" : "--line-length";
      for (let frameIndex = 0; frameIndex < 4; frameIndex++) {
        if (frameIndex) {
          await new Promise(resolve => win.requestAnimationFrame(resolve));
        }
        const value = win.getComputedStyle(target).getPropertyValue(first);
        const computed = win.getComputedStyle(target);
        samples.push({first: value, registeredLength: computed.getPropertyValue("--line-length"),
          metric: computed.getPropertyValue("--line-metric"), weight: computed.fontWeight,
          lineHeight: computed.lineHeight, fontSize: computed.fontSize});
      }
      observations.push({size, metricTarget, samples,
        literal: win.getComputedStyle(target).width,
        reference: win.getComputedStyle(doc.getElementById("reference")).width,
        normal: win.getComputedStyle(doc.getElementById("normal-reference")).width});
    }
    const diagnostic = JSON.stringify({mode, observations});
    for (const row of observations) {
      assert_greater_than(Math.abs(parseFloat(row.reference) - parseFloat(row.normal)), 1, diagnostic);
      assert_approx_equals(parseFloat(row.literal), parseFloat(row.reference), 0.02, diagnostic);
      for (const sample of row.samples) {
        assert_equals(sample.registeredLength, `${row.size}px`, diagnostic);
        assert_equals(sample.fontSize, `${row.size}px`, diagnostic);
        assert_equals(sample.lineHeight, `${row.size}px`, diagnostic);
        assert_equals(sample.weight, "700", diagnostic);
        if (row.metricTarget) {
          assert_approx_equals(parseFloat(sample.first), parseFloat(row.reference), 0.02, diagnostic);
          assert_approx_equals(parseFloat(sample.metric), parseFloat(row.reference), 0.02, diagnostic);
        } else {
          assert_equals(sample.first, `${row.size}px`, diagnostic);
          assert_equals(sample.metric, "2px", diagnostic);
        }
      }
    }
  }, `Registered line-height before selected weight: ${mode}`);
}
</script>

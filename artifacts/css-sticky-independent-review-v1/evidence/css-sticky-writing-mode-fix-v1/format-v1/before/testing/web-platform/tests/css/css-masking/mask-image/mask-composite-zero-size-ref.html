<!doctype html>
<meta charset="utf-8">
<title>Reference: eighty green squares</title>
<style>
  body { margin: 10px; }
  #grid { display: grid; grid-template-columns: repeat(10, 40px); gap: 10px; }
  #grid > div { width: 40px; height: 40px; background: lime; }
</style>
<div id="grid"></div>
<script>
  for (let i = 0; i < 80; ++i) {
    document.getElementById("grid").append(document.createElement("div"));
  }
</script>

<!doctype html>
<meta charset="utf-8">
<title>Zero-size CSS mask images between partial-alpha layers</title>
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#the-mask-composite">
<link rel="match" href="mask-composite-zero-size-three-layers-ref.html">
<meta name="assert" content="A zero-size intermediate mask preserves clipping and subsequent composition under a transform.">
<style>
  body { margin: 10px; }
  #grid { display: grid; grid-template-columns: repeat(4, 100px); gap: 10px; }
  .tile { width: 100px; height: 100px; }
  .target {
    width: 40px;
    height: 40px;
    background: green;
    mask-repeat: no-repeat;
    transform: translate(6px, 4px) scale(2);
    transform-origin: 0 0;
    clip-path: inset(4px 6px 8px 10px);
  }
</style>
<div id="grid"></div>
<script src="support/mask-composite-zero-size-three-layers.js"></script>
<script>buildThreeLayerZeroSizeMaskCases(true);</script>

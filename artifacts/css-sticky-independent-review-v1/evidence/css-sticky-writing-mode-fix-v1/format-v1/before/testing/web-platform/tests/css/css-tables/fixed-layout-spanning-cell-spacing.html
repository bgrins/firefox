<!doctype html>
<meta charset="utf-8">
<title>Fixed table spanning cells preserve border spacing</title>
<link rel="help" href="https://www.w3.org/TR/CSS22/tables.html#fixed-table-layout">
<link rel="help" href="https://www.w3.org/TR/CSS22/tables.html#separated-borders">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
table {
  table-layout: fixed;
  border-collapse: separate;
  inline-size: 1px;
  border: 0;
  padding: 0;
}
td {
  block-size: 10px;
  border: 0;
  padding: 0;
}
</style>
<body>
<script>
for (const writingMode of ["horizontal-tb", "vertical-rl", "vertical-lr"]) {
  for (const direction of ["ltr", "rtl"]) {
    for (const columns of [1, 2, 3]) {
      for (const cellSize of [0, 5, 10, 20, 100]) {
        test(t => {
          const table = document.createElement("table");
          table.style.writingMode = writingMode;
          table.style.direction = direction;
          const spanner = table.insertRow().insertCell();
          spanner.colSpan = columns;
          spanner.style.inlineSize = `${cellSize}px`;
          const row = table.insertRow();
          const cells = Array.from({ length: columns }, () => row.insertCell());
          document.body.append(table);
          t.add_cleanup(() => table.remove());

          for (const spacing of [10, 0, 10]) {
            table.style.borderSpacing = `${spacing}px`;
            const box = table.getBoundingClientRect();
            const vertical = writingMode !== "horizontal-tb";
            const size = rect => vertical ? rect.height : rect.width;
            const start = rect => direction === "rtl"
              ? (vertical ? box.bottom - rect.bottom : box.right - rect.right)
              : (vertical ? rect.top - box.top : rect.left - box.left);
            const tracks = cells.map(cell => cell.getBoundingClientRect());
            const expected = Math.max(1, (columns + 1) * spacing +
              Math.max(0, cellSize - (columns - 1) * spacing));
            const label = `spacing ${spacing}`;
            assert_approx_equals(size(box), expected, 0.05, `${label}: table size`);
            assert_approx_equals(start(tracks[0]), spacing, 0.05, `${label}: start gap`);
            assert_approx_equals(size(box) - start(tracks.at(-1)) - size(tracks.at(-1)),
              spacing, 0.05, `${label}: end gap`);
            for (let i = 0; i < tracks.length; ++i) {
              assert_greater_than_equal(size(tracks[i]), 0, `${label}: track ${i}`);
              if (i > 0) {
                assert_approx_equals(start(tracks[i]) - start(tracks[i - 1]) -
                  size(tracks[i - 1]), spacing, 0.05, `${label}: gap ${i}`);
              }
            }
          }
        }, `${writingMode}, ${direction}, span ${columns}, cell size ${cellSize}px`);
      }
    }
  }
}
</script>

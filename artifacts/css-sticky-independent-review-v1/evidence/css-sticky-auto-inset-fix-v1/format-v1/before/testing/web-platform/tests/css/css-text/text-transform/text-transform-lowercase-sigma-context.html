<!doctype html>
<meta charset="utf-8">
<title>CSS Text: lowercase sigma context</title>
<link rel="help" href="https://drafts.csswg.org/css-text-3/#text-transform-mapping">
<link rel="help" href="https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-3/">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  .fixture {
    text-transform: lowercase;
    white-space: pre;
  }
</style>
<body>
<script>
const cases = [
  ["en", "\u6f22\u03a3", "\u6f22\u03c3"],
  ["en", "A\u03a3\u6f22", "a\u03c2\u6f22"],
  ["en", "A\u03a3'A", "a\u03c3'a"],
  ["en", "\u03a3", "\u03c3"],
  ["en", "A\u03a3", "a\u03c2"],
  ["en", "A\u03a3A", "a\u03c3a"],
  ["en", "\u01bb\u03a3", "\u01bb\u03c3"],
  ["en", "A\u03a3\u01bb", "a\u03c2\u01bb"],
  ["en", "\u0345\u03a3", "\u0345\u03c3"],
  ["en", "A\u0345\u03a3", "a\u0345\u03c2"],
  ["en", "A\u03a3\u0345", "a\u03c2\u0345"],
  ["en", "A\u03a3\u0345A", "a\u03c3\u0345a"],
  ["en", "\u2160\u03a3", "\u2170\u03c2"],
  ["en", "A\u03a3\u2160", "a\u03c3\u2170"],
  ["en", "\u24b6\u03a3", "\u24d0\u03c2"],
  ["en", "A\u03a3\u24b6", "a\u03c3\u24d0"],
  ["en", "A'\u03a3", "a'\u03c2"],
  ["en", "A\u03a3'", "a\u03c2'"],
  ["en", "A/\u03a3", "a/\u03c3"],
  ["en", "A\u03a3/A", "a\u03c2/a"],
  ["en", "A\u03a3\u03a3", "a\u03c3\u03c2"],
  ["en", "\u03a3\u03a3", "\u03c3\u03c2"],
  ["en", "\u03a3\u0345\u03a3", "\u03c3\u0345\u03c2"],
  ["en", "\u0130\u03a3", "i\u0307\u03c2"],
  ["en", "A\u03a3\u0130", "a\u03c3i\u0307"],
  ["en", "\ud801\udc00\u03a3", "\ud801\udc28\u03c2"],
  ["en", "A\u03a3\ud801\udc00", "a\u03c3\ud801\udc28"],
  ["en", "A\ud834\udd67\u03a3", "a\ud834\udd67\u03c2"],
  ["en", "A\u03a3\ud834\udd67A", "a\u03c3\ud834\udd67a"],
  ["en", "A\ud840\udc00\u03a3", "a\ud840\udc00\u03c3"],
  ["en", "A\u03a3\ud840\udc00A", "a\u03c2\ud840\udc00a"],
  ["en", "n\u03a3", "n\u03c2"],
  ["en", "t\u03a3", "t\u03c2"],
  ["tr", "A\u03a3I", "a\u03c3\u0131"],
  ["tr", "A\u03a3\u0130", "a\u03c3i"],
  ["tr", "I\u03a3", "\u0131\u03c2"],
  ["az", "A\u03a3I", "a\u03c3\u0131"],
  ["az", "A\u03a3\u0130", "a\u03c3i"],
  ["az", "I\u03a3", "\u0131\u03c2"],
  ["lt", "A\u03a3I", "a\u03c3i"],
  ["lt", "A\u03a3J", "a\u03c3j"],
  ["lt", "A\u03a3\u00cc", "a\u03c3i\u0307\u0300"],
  ["lt", "\u00cc\u03a3", "i\u0307\u0300\u03c2"],
];

function codePoints(text) {
  return Array.from(text, ch =>
    "U+" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")
  ).join(" ");
}

function makeFixture(t, language) {
  const element = document.createElement("div");
  element.className = "fixture";
  element.lang = language;
  document.body.append(element);
  t.add_cleanup(() => element.remove());
  return element;
}

for (const [language, input, expected] of cases) {
  test(t => {
    const element = makeFixture(t, language);
    element.append(document.createTextNode(input));
    assert_equals(element.innerText, expected, "Rendered text");
    assert_equals(element.textContent, input, "Source text");
  }, `single node: ${language}, ${codePoints(input)}`);
}
</script>

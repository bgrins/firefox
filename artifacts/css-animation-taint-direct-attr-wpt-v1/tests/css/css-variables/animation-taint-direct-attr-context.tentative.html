<!doctype html>
<meta charset="utf-8">
<title>Animation-tainted variables nested in typed attr use the property context</title>
<link rel="help" href="https://drafts.csswg.org/css-values-5/#attr-substitution">
<link rel="help" href="https://drafts.csswg.org/css-variables-1/#replace-a-var-function">
<link rel="help" href="https://www.w3.org/TR/css-writing-modes-3/#propdef-writing-mode">
<meta name="assert" content="A tainted variable nested in typed attr selects its var fallback when substituted into non-animatable writing-mode.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";

const modes = ["tainted-attr", "untainted-attr", "literal-attr", "direct-var"];

function calibration(row) {
  const checks = [];
  const add = (name, passed) => checks.push({name, passed: Boolean(passed)});
  add("collection complete", row.error === null && row.stage === "complete");
  if (row.before) {
    add("ordinary variable before effect", row.before.variable === (row.mode === "untainted-attr" ? "horizontal-tb" : "vertical-rl"));
  }
  if (row.active) {
    const value = row.active;
    add("active variable", value.variable === (row.mode !== "literal-attr" ? "horizontal-tb" : "vertical-rl"));
    add("held driver", value.timing.duration === 2000 &&
      value.timing.computedDuration === 2000 && value.timing.time === 750 &&
      Math.abs(value.timing.progress - .375) < .000001 && value.timing.state === "paused");
    add("active identity", value.effectSame && row.activeMembership?.count === 1 &&
      row.activeMembership.sameAnimation && row.activeMembership.sameEffect);
  }
  if (row.cancelled) {
    add("ordinary variable after cancellation", row.cancelled.variable === (row.mode === "untainted-attr" ? "horizontal-tb" : "vertical-rl"));
    add("cancelled lifecycle", row.cancelled.timing.state === "idle" &&
      row.cancelled.timing.time === null && row.cancelled.effectSame &&
      row.cancelMembership?.count === 0);
  }
  if (row.mode === "literal-attr") {
    const samples = [...row.activeSamples, ...row.cancelSamples];
    add("literal sink", row.before?.sink === "vertical-lr" &&
      row.active?.sink === "vertical-lr" && row.cancelled?.sink === "vertical-lr" &&
      samples.length === 8 && samples.every(value => value.sink === "vertical-lr"));
  }
  return checks;
}

function activeExpectation(row) {
  if (!row.active) return null;
  const expectedSink = row.mode === "untainted-attr" ? "horizontal-tb" : "vertical-lr";
  return {expectedSink, kind: ["tainted-attr", "direct-var"].includes(row.mode) ?
    "direct-substitution-interpretation" : "control",
    matches: row.active.sink === expectedSink && row.activeSamples.length === 4 &&
      row.activeSamples.every(value => value.sink === expectedSink)};
}

async function observe(t, mode) {
  const row = {mode, stage: "setup", error: null, before: null,
    activeSamples: [], active: null, activeMembership: null,
    cancelSamples: [], cancelled: null, cancelMembership: null,
    referenceChecks: [], activeExpectation: null, policyVerdict: null};
  const frame = document.createElement("iframe");
  let animation;
  t.add_cleanup(() => { animation?.cancel(); frame.remove(); });
  try {
    const loaded = new Promise(resolve => frame.onload = resolve);
    frame.srcdoc = `<!doctype html><style>
      body { writing-mode: vertical-rl; }
      .target { --v: ${mode === "untainted-attr" ? "horizontal-tb" : "vertical-rl"}; writing-mode: ${mode === "direct-var" ? "var(--v, vertical-lr)" : "attr(data-v type(<custom-ident>), vertical-rl)"}; }
    </style><div class="target" data-v="${mode === "literal-attr" ? "vertical-lr" : "var(--v, vertical-lr)"}">sample</div>`;
    document.body.append(frame);
    await loaded;
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const target = doc.querySelector(".target");
    const sink = () => win.getComputedStyle(target).writingMode;
    let effect;
    const details = () => {
      const style = win.getComputedStyle(target);
      const computed = effect?.getComputedTiming();
      return {sink: style.writingMode,
        variable: style.getPropertyValue("--v").trim(),
        timing: effect ? {duration: effect.getTiming().duration,
          computedDuration: computed.duration, progress: computed.progress,
          time: animation.currentTime, state: animation.playState} : null,
        effectSame: effect ? animation.effect === effect : null};
    };
    const membership = () => {
      const current = target.getAnimations();
      return {count: current.length, sameAnimation: current.includes(animation),
        sameEffect: animation.effect === effect};
    };
    const sample = async into => {
      into.push({phase: "first-read", sink: sink()});
      for (let i = 1; i <= 3; ++i) {
        await new Promise(resolve => win.requestAnimationFrame(resolve));
        into.push({phase: `passive-frame-${i}`, sink: sink()});
      }
    };
    row.before = details();
    row.stage = "create";
    const sheet = doc.createElement("style");
    const endpoints = ["tainted-attr", "direct-var"].includes(mode) ?
      "--v: horizontal-tb" : "opacity: 1";
    sheet.textContent = `@keyframes hold { from, to { ${endpoints}; } }
      .target { animation: hold 2s linear both paused; }`;
    doc.head.append(sheet);
    const acquired = target.getAnimations();
    if (acquired.length !== 1) throw new Error("Expected one CSS driver");
    animation = acquired[0];
    effect = animation.effect;
    await animation.ready;
    animation.currentTime = 750;
    row.stage = "active samples";
    await sample(row.activeSamples);
    row.active = details();
    row.activeMembership = membership();
    row.stage = "cancel";
    animation.cancel();
    await sample(row.cancelSamples);
    row.cancelled = details();
    row.cancelMembership = membership();
    row.stage = "complete";
  } catch (error) {
    row.error = {name: error.name, message: error.message, stack: error.stack || ""};
  } finally {
    animation?.cancel();
    frame.remove();
    row.referenceChecks = calibration(row);
    row.activeExpectation = activeExpectation(row);
  }
  return row;
}

for (const mode of modes) {
  promise_test(async t => {
    const row = await observe(t, mode);
    const trace = JSON.stringify(row, (_key, value) =>
      typeof value === "number" && !Number.isFinite(value) ? {nonfinite: String(value)} : value);
    for (const check of row.referenceChecks) {
      assert_true(check.passed, `${check.name}; ${trace}`);
    }
    assert_true(row.activeExpectation !== null, `active observation collected; ${trace}`);
    assert_true(row.activeExpectation.matches, `active writing-mode selects ${row.activeExpectation.expectedSink}; ${trace}`);
  }, `Animation taint ${mode}: direct substitution preserves the ordinary property context`);
}
</script>

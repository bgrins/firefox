<style>@property --n { syntax: "<number>"; inherits: false; initial-value: 3; }</style>

<script>
function makeTarget(t, css, parentCSS = "", attributes = {}, fontSize = "calc(var(--n)*1px)") {
  const parent = document.createElement("div");
  parent.style.cssText = "font-size:19px;line-height:23px;" + parentCSS;
  const target = document.createElement("div");
  target.style.cssText = css + ";font-size:" + fontSize;
  for (const [name, value] of Object.entries(attributes)) {
    target.setAttribute(name, value);
  }
  parent.append(target);
  document.body.append(parent);
  t.add_cleanup(() => parent.remove());
  return target;
}

function check(target, expected) {
  const computed = getComputedStyle(target);
  for (const [property, value] of Object.entries(expected)) {
    assert_equals(computed.getPropertyValue(property).trim(), value, property);
  }
}


function snapshot(target, names) {
  const style = getComputedStyle(target);
  return Object.fromEntries(names.map(name => [name, style.getPropertyValue(name).trim()]));
}

test(t => {
  const target = makeTarget(t, "--n:calc(1em / 1px);font-size:20px;width:calc(var(--n) * 1px)", "", {}, "20px");
  const actual = [];
  for (const size of [20, 30]) {
    target.style.fontSize = size + "px";
    actual.push(snapshot(target, ["--n", "font-size", "width"]));
  }
  const detail = "observed=" + JSON.stringify(actual);
  for (let i = 0; i < actual.length; ++i) {
    const size = [20, 30][i];
    assert_equals(actual[i]["--n"], String(size), detail);
    assert_equals(actual[i]["font-size"], size + "px", detail);
    assert_equals(actual[i].width, size + "px", detail);
  }
}, "normative: noncyclic-numeric-length-division");

test(t => {
  const target = makeTarget(t, "--n:calc(1lh / 1px);line-height:40px;width:calc(var(--n)*1px)", "", {}, "20px");
  const actual = [];
  for (const value of [40, 50]) {
    target.style.lineHeight = value + "px";
    actual.push(snapshot(target, ["--n", "font-size", "line-height", "width"]));
  }
  const detail = "observed=" + JSON.stringify(actual);
  for (let i = 0; i < actual.length; ++i) {
    const value = [40, 50][i];
    assert_equals(actual[i]["--n"], String(value), detail);
    assert_equals(actual[i]["font-size"], "20px", detail);
    assert_equals(actual[i]["line-height"], value + "px", detail);
    assert_equals(actual[i].width, value + "px", detail);
  }
}, "Admitted number follows current line-height mutation");

test(t => {
  const target = makeTarget(t, "--n:calc(1px / 1em);width:calc(var(--n)*1000px)", "", {}, "20px");
  const actual = [];
  for (const size of [20, 25]) {
    target.style.fontSize = size + "px";
    actual.push(snapshot(target, ["--n", "font-size", "width"]));
  }
  const detail = "observed=" + JSON.stringify(actual);
  for (let i = 0; i < actual.length; ++i) {
    assert_approx_equals(Number(actual[i]["--n"]), [0.05, 0.04][i], 0.000001, detail);
    assert_equals(actual[i]["font-size"], ["20px", "25px"][i], detail);
    assert_equals(actual[i].width, ["50px", "40px"][i], detail);
  }
}, "Admitted inverse number follows current font-size mutation");

for (const item of breadthCases) {
  test(t => {
    for (const registration of item.registrations) CSS.registerProperty(registration);
    const parent = document.createElement("div");
    parent.style.cssText = item.parent;
    const target = document.createElement("div");
    target.style.cssText = item.declarations + ";font-size:" + item.fontSize + ";width:" + item.width;
    parent.append(target);
    document.body.append(parent);
    t.add_cleanup(() => parent.remove());
    const observations = [];
    for (const step of item.snapshots) {
      for (const [property, value] of Object.entries(step.set)) target.style.setProperty(property, value);
      const computed = getComputedStyle(target);
      observations.push({value:computed.getPropertyValue(item.names.value).trim(),
        number:item.names.number ? computed.getPropertyValue(item.names.number).trim() : null,
        fontSize:computed.fontSize, width:computed.width});
    }
    const detail = "observed=" + JSON.stringify(observations);
    for (let i = 0; i < observations.length; ++i) {
      for (const [property, expected] of Object.entries(item.snapshots[i].expected)) {
        assert_equals(observations[i][property], expected, detail + ": " + item.snapshots[i].label + ": " + property);
      }
    }
  }, "Registered numeric breadth: " + item.id);
}

for (const [syntax, separator, suffix] of [["<number>+", " ", "space"], ["<number>#", ", ", "comma"]]) {
  test(t => {
    const name = `--numeric-list-${suffix}-later-member-math`;
    CSS.registerProperty({name, syntax, inherits:false, initialValue:"3"});
    const target = makeTarget(t, name + ":2" + separator + "calc(1em / 1px)", "", {}, "20px");
    const observations = [];
    for (const fontSize of [20, 30]) {
      target.style.fontSize = fontSize + "px";
      observations.push(snapshot(target, [name, "font-size"]));
    }
    const detail = "observed=" + JSON.stringify(observations);
    for (let i = 0; i < observations.length; ++i) {
      const values = observations[i][name].split(/\s*,\s*|\s+/).map(Number);
      assert_array_equals(values, [2, [20, 30][i]], detail);
      assert_equals(observations[i]["font-size"], ["20px", "30px"][i], detail);
    }
  }, `Registered numeric list: ${syntax}, later-member-math`);
}

for (const [index, item] of cases.entries()) {
  test(() => {
    assert_true(CSS.supports(item.property, item.initialValue), "Ordinary value syntax is supported");
    const definition = {
      name: `--initial-selection-${index}`,
      syntax: item.syntax,
      inherits: false,
      initialValue: item.initialValue,
    };
    if (item.valid) {
      CSS.registerProperty(definition);
    } else {
      assert_throws_dom("SyntaxError", () => CSS.registerProperty(definition));
      CSS.registerProperty({...definition, initialValue: item.replacement});
    }
  }, `Registered initial selection: ${item.id}`);

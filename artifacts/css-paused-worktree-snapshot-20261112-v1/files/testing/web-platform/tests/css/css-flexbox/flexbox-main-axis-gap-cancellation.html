<!doctype html>
<meta charset="utf-8">
<title>Flex alignment preserves positions after large gap cancellation</title>
<link rel="help" href="https://drafts.csswg.org/css-align-3/#positional-values">
<link rel="help" href="https://drafts.csswg.org/css-align-3/#overflow-values">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#gap-flex">
<meta name="assert" content="Center and end alignment preserve small final positions when accumulated gaps are large.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  .container {
    position: relative;
    display: flex;
    flex-wrap: nowrap;
    width: 1000px;
    height: 1000px;
    align-items: flex-start;
  }
  .item {
    flex: 0 0 0px;
    width: 0;
    height: 0;
    min-width: 0;
    min-height: 0;
  }
  .reference {
    position: absolute;
    width: 0;
    height: 0;
    left: 0;
    top: 0;
  }
</style>
<body>
<script>
for (const direction of ["row", "row-reverse", "column", "column-reverse"]) {
  for (const [count, gap] of [[3, 1000], [5, 1000], [5, 10000000], [7, 10000000], [9, 10000000], [15, 10000000], [359, 100000]]) {
    for (const alignment of ["unsafe center", "unsafe flex-end"]) {
      test(t => {
        const container = document.createElement("div");
        container.className = "container";
        container.style.flexDirection = direction;
        container.style.justifyContent = alignment;
        container.style.gap = `${gap}px`;
        for (let i = 0; i < count; i++) {
          const item = document.createElement("div");
          item.className = "item";
          container.append(item);
        }
        document.body.append(container);
        t.add_cleanup(() => container.remove());

        const axis = direction.startsWith("row") ? "x" : "y";
        const index = alignment === "unsafe center" ? (count - 1) / 2 : count - 1;
        const expected = alignment === "unsafe center" ? 500 :
          direction.endsWith("reverse") ? 0 : 1000;
        const reference = document.createElement("div");
        reference.className = "reference";
        reference.style[axis === "x" ? "left" : "top"] = `${expected}px`;
        container.append(reference);

        const origin = container.getBoundingClientRect()[axis];
        const referenceOffset = reference.getBoundingClientRect()[axis] - origin;
        assert_approx_equals(referenceOffset, expected, 0.05, "Reference position");
        const actual = container.children[index].getBoundingClientRect()[axis] - origin;
        assert_approx_equals(actual, referenceOffset, 0.05, "Flex item position");
      }, `${direction}, ${alignment}: item in ${count} items with gap ${gap}px`);
    }
  }
}
</script>

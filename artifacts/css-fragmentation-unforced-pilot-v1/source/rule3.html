<dd>
      Breaking at a <a href="#btw-lines">class B break point</a> is allowed only if the number
      of line boxes between the break and the start of the enclosing block
      box is the value of <a class="css property" data-link-type="property" href="#propdef-orphans" id="ref-for-propdef-orphans⑤">orphans</a> or more, and the number of line boxes
      between the break and the end of the box is the value of <a class="css property" data-link-type="property" href="#propdef-widows" id="ref-for-propdef-widows⑤">widows</a> or more.

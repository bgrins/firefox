<p>
    If even that does not lead to sufficient break points,
    <a href="#valdef-box-decoration-break-clone" id="ref-for-valdef-box-decoration-break-clone">cloned margins/border/padding</a>
    at the <a data-link-type="dfn" href="https://drafts.csswg.org/css-writing-modes-4/#block-end" id="ref-for-block-end">block-end</a> side are truncated;
    and if more room is still needed,
    <a href="#valdef-box-decoration-break-clone" id="ref-for-valdef-box-decoration-break-clone①">cloned margins/border/padding</a>
    are truncated at the <a data-link-type="dfn" href="https://drafts.csswg.org/css-writing-modes-4/#block-start" id="ref-for-block-start">block-start</a> side as well.
  </p>

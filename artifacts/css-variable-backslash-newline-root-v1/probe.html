<!doctype html>
<meta charset="utf-8">
<title>Custom property backslash and newline</title>
<body>
<script>
const cases = [];
for (const [name, newline] of [["LF", "\n"], ["CR", "\r"], ["FF", "\f"], ["CRLF", "\r\n"]]) {
  for (const prefix of ["", "x"]) {
    for (const suffix of ["", " \t", "/**/"]) {
      cases.push({label: `${name}/${JSON.stringify(prefix)}/${JSON.stringify(suffix)}`,
                  value: prefix + "\\" + newline + suffix, expected: "none", valid: false});
    }
  }
}
for (const value of ["control", "control ", "x\\ ", "x\\\t", "x\\\\", "x\\78", "\"x\"", "x/**/"]) {
  const literal = document.createElement("div");
  literal.style.animationName = value;
  document.body.append(literal);
  cases.push({label: `valid/${JSON.stringify(value)}`, value,
              expected: getComputedStyle(literal).animationName, valid: true});
  literal.remove();
}
const rows = cases.map(c => {
  const literal = document.createElement("div");
  literal.style.animationName = c.value;
  const supported = CSS.supports("animation-name", c.value);
  const target = document.createElement("div");
  target.style.animationName = "var(--probe)";
  document.body.append(target);
  const states = [];
  const failures = [];
  if (supported !== c.valid || Boolean(literal.style.animationName) !== c.valid) {
    failures.push("Literal syntax calibration");
  }
  for (const [phase, value, expected] of [
    ["initial", "control", "control"], ["set", c.value, c.expected],
    ["restore", "control", "control"], ["set-again", c.value, c.expected],
  ]) {
    target.style.setProperty("--probe", value);
    const style = getComputedStyle(target);
    const actual = style.animationName;
    states.push({phase, actual, expected, specified: target.style.getPropertyValue("--probe"),
                 computed: style.getPropertyValue("--probe")});
    if (actual !== expected) failures.push(`${phase}: ${JSON.stringify(actual)} != ${JSON.stringify(expected)}`);
  }
  target.remove();
  return {...c, supported, states, failures};
});
fetch("/result", {method: "POST", headers: {"Content-Type": "application/json"},
                  body: JSON.stringify({complete: true, compatMode: document.compatMode, rows})});
</script>

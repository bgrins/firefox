<h4 class="heading settled" data-level="5.4.2" id="combine-dimensions"><span class="secno">5.4.2. </span><span class="content">
Combination of Dimensions</span><a class="self-link" href="#combine-dimensions"></a></h4>
   <p><a data-link-type="dfn" href="#interpolation" id="ref-for-interpolation④">Interpolation</a> of <a data-link-type="dfn" href="#compatible-units" id="ref-for-compatible-units②">compatible</a> <a data-link-type="dfn" href="#dimension" id="ref-for-dimension⑤">dimensions</a>
	(for example, two <a class="css production" data-link-type="type" href="#length-value" id="ref-for-length-value⑧">&lt;length></a> values)
	is defined as
	<var>V</var><sub>result</sub> =
		(1 - <var>p</var>) × <var>V<sub>A</sub></var> +
		<var>p</var> × <var>V<sub>B</sub></var></p>
   <p><a data-link-type="dfn" href="#addition" id="ref-for-addition⑨">Addition</a> of <a data-link-type="dfn" href="#compatible-units" id="ref-for-compatible-units③">compatible</a> <a data-link-type="dfn" href="#dimension" id="ref-for-dimension⑥">dimensions</a> is defined as
	<var>V<sub>result</sub></var> =
		<var>V<sub>A</sub></var> + <var>V<sub>B</sub></var></p>

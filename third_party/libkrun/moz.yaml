updating:
  notes: |
    Built by browser/components/harness/vm/setup-deps.sh via the upstream
    Makefile (cargo build); not integrated with the mach cargo workspace yet.
    Crate dependencies are fetched from crates.io at build time. The guest
    kernel (libkrunfw, GPL) is deliberately not vendored; setup-deps.sh
    fetches a pinned prebuilt kernel bundle instead.

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Infinite Canvas - Test Page</title>
  <link rel="stylesheet" href="canvas-engine.css">
  <link rel="stylesheet" href="canvas-toolbar.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    #canvas-container {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #event-log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: rgba(0,0,0,0.85);
      color: #aaa;
      font-family: monospace;
      font-size: 11px;
      overflow-y: auto;
      padding: 8px;
      z-index: 1000;
      border-top: 1px solid #333;
      display: none;
    }
    #event-log.visible { display: block; }
    #event-log .log-entry { padding: 1px 0; }
    #event-log .log-entry .event-name { color: #0a84ff; }
  </style>
</head>
<body>
  <div id="toolbar"></div>
  <div id="canvas-container"></div>
  <div id="event-log"></div>

  <script type="module" src="test.js"></script>
</body>
</html>

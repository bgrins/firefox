<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Infinite Canvas - Test Page</title>
  <link rel="stylesheet" href="canvas-engine.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #111;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      z-index: 1000;
      border-bottom: 1px solid #333;
    }

    #toolbar button {
      background: #333;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    #toolbar button:hover { background: #444; }
    #toolbar button.active { background: #0a84ff; border-color: #0a84ff; color: #fff; }

    #toolbar .separator {
      width: 1px;
      height: 20px;
      background: #444;
    }

    #toolbar .label {
      color: #888;
      font-size: 11px;
    }

    #toolbar #zoom-display {
      color: #ccc;
      font-size: 12px;
      min-width: 40px;
      text-align: center;
    }

    #canvas-container {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #event-log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: rgba(0,0,0,0.85);
      color: #aaa;
      font-family: monospace;
      font-size: 11px;
      overflow-y: auto;
      padding: 8px;
      z-index: 1000;
      border-top: 1px solid #333;
      display: none;
    }
    #event-log.visible { display: block; }
    #event-log .log-entry { padding: 1px 0; }
    #event-log .log-entry .event-name { color: #0a84ff; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-add-node">+ Node</button>
    <button id="btn-add-frame">+ Frame (F)</button>
    <div class="separator"></div>
    <button id="btn-snap" class="active">Snap: ON</button>
    <button id="btn-fit">Fit All (Ctrl+1)</button>
    <div class="separator"></div>
    <span class="label">Zoom:</span>
    <span id="zoom-display">100%</span>
    <div class="separator"></div>
    <span class="label">Selection:</span>
    <span id="selection-display">none</span>
    <div class="separator"></div>
    <button id="btn-log">Toggle Log</button>
  </div>

  <div id="canvas-container"></div>
  <div id="event-log"></div>

  <script src="canvas-engine.js"></script>
  <script src="test.js"></script>
</body>
</html>

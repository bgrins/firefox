<!-- AI Mode Interface Components -->
<html:div id="ai-mode-container" xmlns:html="http://www.w3.org/1999/xhtml">
  <!-- Firefox Logo with AI Mode branding -->
  <html:div id="ai-mode-logo">
    <html:svg width="62" height="63" viewBox="0 0 62 63" fill="none">
      <!-- Firefox logo paths -->
      <html:path d="M61.0642 22.3694C59.3379 13.1847 52.256 5.76031 42.9967 3.30775C42.6172 3.20538 42.233 3.12173 41.8453 3.05721C41.3575 2.9736 40.8644 2.91353 40.3688 2.87735C39.9918 2.84721 39.6142 2.82868 39.236 2.82178C38.8248 2.81178 38.4135 2.81178 38.0016 2.82178C37.6227 2.82868 37.2445 2.84721 36.8675 2.87735C36.3719 2.91353 35.8788 2.9736 35.391 3.05721C35.0027 3.12173 34.6179 3.20538 34.2384 3.30775C24.9803 5.76031 17.8984 13.1847 16.1715 22.3694C15.9491 23.5589 15.8235 24.766 15.796 25.9792V26.0332V26.0877V26.1411C15.8235 27.3543 15.9491 28.5614 16.1715 29.7509C17.0597 34.2823 19.4278 38.3923 22.8903 41.4625L23.3571 41.8774C23.3956 41.9101 23.4341 41.9422 23.4732 41.9743L23.9793 42.3694C27.7695 45.3054 32.5337 46.975 37.5012 46.9997V47H37.6321H38.3709H38.5018V46.9997C43.4693 46.975 48.2335 45.3054 52.0237 42.3694L52.5298 41.9743C52.5689 41.9422 52.6074 41.9101 52.6459 41.8774L53.1127 41.4625C56.5752 38.3923 58.9433 34.2823 59.8315 29.7509C60.0539 28.5614 60.1795 27.3543 60.207 26.1411V26.0877V26.0332V25.9792C60.1795 24.766 60.0539 23.5589 59.8315 22.3694Z" fill="url(#firefox-gradient)"/>
      <html:defs>
        <html:linearGradient id="firefox-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <html:stop offset="0%" style="stop-color:#FFA436;stop-opacity:1" />
          <html:stop offset="50%" style="stop-color:#FF6B6B;stop-opacity:1" />
          <html:stop offset="100%" style="stop-color:#d6b4fd;stop-opacity:1" />
        </html:linearGradient>
      </html:defs>
    </html:svg>
    <html:span id="ai-mode-logo-text">AI Mode</html:span>
  </html:div>

  <!-- Main Search Container -->
  <html:div id="ai-mode-searchbar">
    <!-- Input Container -->
    <html:div id="ai-mode-input-container">
      <html:input id="ai-mode-input" 
                  type="text" 
                  placeholder="Help me find a new pair of sneakers"
                  autocomplete="off" />
    </html:div>
    
    <!-- Controls -->
    <html:div id="ai-mode-controls">
      <!-- Left side - Add button -->
      <html:button id="ai-mode-add-button">
        <html:svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <html:path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </html:svg>
        <html:span id="ai-mode-add-text">Add images, tabs, files</html:span>
      </html:button>
      
      <!-- Right side - Mic and Ask button -->
      <html:div id="ai-mode-right-controls">
        <!-- Mic button -->
        <html:button id="ai-mode-mic">
          <html:svg width="12" height="18" viewBox="0 0 12 18" fill="none">
            <html:path d="M6 11.5C7.933 11.5 9.5 9.933 9.5 8V3.5C9.5 1.567 7.933 0 6 0C4.067 0 2.5 1.567 2.5 3.5V8C2.5 9.933 4.067 11.5 6 11.5Z" fill="currentColor"/>
            <html:path d="M11 8C11 11.0376 8.53757 13.5 5.5 13.5C2.46243 13.5 0 11.0376 0 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <html:path d="M6 13.5V17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </html:svg>
        </html:button>
        
        <!-- Ask button -->
        <html:button id="ai-mode-ask-button">
          <html:span>Ask</html:span>
          <html:svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <html:path d="M6 3L11 8L6 13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </html:svg>
        </html:button>
      </html:div>
    </html:div>
  </html:div>

  <!-- Suggestion Pills -->
  <html:div id="ai-mode-suggestions">
    <html:button class="ai-mode-suggestion" data-action="music">
      <html:span class="ai-mode-suggestion-emoji">🎧</html:span>
      <html:span class="ai-mode-suggestion-text">Show me similar music on YouTube</html:span>
    </html:button>
    
    <html:button class="ai-mode-suggestion" data-action="tips">
      <html:span class="ai-mode-suggestion-emoji">💡</html:span>
      <html:span class="ai-mode-suggestion-text">Tips for using AI Mode</html:span>
    </html:button>
  </html:div>
</html:div>

updating:
  notes: |
    fdm-core.mjs is generated from the firefox-devtools-mcp repository:
      cd extension && npm install && npm run build:moz
    then copy extension/dist/fdm-core.mjs here. The bundle expects an embedder to
    call configure({bidi, version, setTimeout, clearTimeout}) before startMcp(port);
    MCPServer.sys.mjs does this with MCPBridge as the bidi implementation.

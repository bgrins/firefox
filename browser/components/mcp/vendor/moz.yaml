origin:
  name: firefox-devtools-mcp
  description: MCP tool surface for Firefox automation (tools, facade, and MCP
    protocol layer bundled for in-browser use)
  url: https://github.com/bgrins/firefox-devtools-mcp
  release: embedded branch, commit 0293964063c50c911add7c9ab81e9cae51571004
  revision: 0293964063c50c911add7c9ab81e9cae51571004
  license: ["MIT", "Apache-2.0"]

updating:
  notes: |
    fdm-core.mjs is generated from the firefox-devtools-mcp repository
    (embedded branch):
      cd embedded && npm install && npm run build:moz
    then copy embedded/dist/fdm-core.mjs here. The bundle expects an embedder to
    call configure({bidi, version, setTimeout, clearTimeout}) before startMcp(port);
    MCPServer.sys.mjs does this with MCPBridge as the bidi implementation.

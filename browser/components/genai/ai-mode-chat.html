<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" role="document">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src resource: chrome:; object-src 'none'; img-src data: chrome:;"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="genai-chatbot-title"></title>
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/genai.ftl" />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="stylesheet" href="chrome://browser/content/genai/ai-mode-chat.css" />
    <script src="chrome://browser/content/contentTheme.js"></script>
    <script src="chrome://browser/content/genai/ai-mode-chat.js"></script>
  </head>
  <body>
    <div id="ai-chat-container">
      <div id="ai-chat-header">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="margin-left: 8px; opacity: 0.6;">
          <rect x="3" y="3" width="4" height="4" rx="0.5"/>
          <rect x="9" y="3" width="4" height="4" rx="0.5"/>
          <rect x="3" y="9" width="4" height="4" rx="0.5"/>
          <rect x="9" y="9" width="4" height="4" rx="0.5"/>
        </svg>
        <h1>AI Assistant</h1>
        <button id="ai-chat-close" type="button" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M9 3L3 9M3 3L9 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="ai-chat-messages">
        <div class="ai-welcome-message">
          <h2>Welcome! How can I help you today?</h2>
          <p>I can answer questions, help with tasks, or have a conversation.</p>
        </div>
      </div>
      <div id="ai-chat-input-container">
        <div class="ai-chat-omnibox">
          <div id="ai-chat-input-wrapper">
            <textarea 
              id="ai-chat-input" 
              placeholder="Ask, search, or type a URL"
              rows="1"
            ></textarea>
          </div>
          <div class="ai-chat-controls">
            <button class="ai-chat-add-button" type="button">
              <div class="ai-chat-add-icon">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor">
                  <path d="M7.5 2.5v5m0 0v5m0-5h5m-5 0h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </div>
            </button>
            <div class="ai-chat-right-controls">
              <button class="ai-chat-mic-button" type="button" aria-label="Voice input">
                <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor">
                  <path d="M6 0C4.34 0 3 1.34 3 3v6c0 1.66 1.34 3 3 3s3-1.34 3-3V3c0-1.66-1.34-3-3-3z"/>
                  <path d="M11 9c0 2.76-2.24 5-5 5s-5-2.24-5-5H0c0 3.53 2.61 6.43 6 6.92V18h2v-2.08c3.39-.49 6-3.39 6-6.92h-1z"/>
                </svg>
              </button>
              <button id="ai-chat-send" type="button">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" opacity="0.5">
                  <path d="M5.5 8.5l3-3m0 0l3 3m-3-3v7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

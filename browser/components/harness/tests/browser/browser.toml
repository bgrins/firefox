[DEFAULT]
# The micro-VM stack (libkrun/Hypervisor.framework) only exists on macOS
# arm64, and the runtime deps come from setup-deps.sh rather than the build;
# the test also skips itself gracefully when those artifacts are missing.
skip-if = [
  "arch != 'aarch64'",
  "os != 'mac'",
]

["browser_about_harness_ui.js"]

["browser_agent_approvals.js"]

["browser_agent_service.js"]

["browser_browser_tools.js"]

["browser_codex_client.js"]

["browser_codex_exec_bridge.js"]

["browser_harness_mounts.js"]

["browser_harness_overlay.js"]

["browser_harness_proxy.js"]

["browser_harness_pty.js"]

["browser_harness_sessions.js"]

["browser_harness_site_scheme.js"]

["browser_harness_vm.js"]

["browser_harness_widget_embed.js"]

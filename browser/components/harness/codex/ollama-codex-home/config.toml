# Reusable CODEX_HOME template for local development and tests: points the
# pinned codex-app-server at a local ollama instance (no credentials, no
# OpenAI account) so chat turns are free. CodexAppServerClient copies this
# directory to create a dedicated CODEX_HOME; tests do the same.
#
# Requires: ollama running on 127.0.0.1:11434 with the model below pulled.
# Note: as of codex 0.145.0 "ollama" is a reserved built-in provider
# (defaulting to 127.0.0.1:11434), so it must not be redefined under
# [model_providers]; override OLLAMA_HOST in the environment if it runs
# elsewhere.

model_provider = "ollama"
model = "gemma4:latest"

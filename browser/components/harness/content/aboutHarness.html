<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'"
    />
    <title>Harness</title>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/harness/aboutHarness.css"
    />
    <script
      type="module"
      src="chrome://browser/content/harness/aboutHarness.mjs"
    ></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Harness sandbox</h1>
        <span id="status" data-state="stopped">stopped</span>
        <div class="controls">
          <button id="start">Start</button>
          <button id="stop" disabled>Stop</button>
          <button id="reset">Reset rootfs</button>
        </div>
      </header>
      <section id="disabled-notice" hidden>
        <p>
          The harness sandbox is disabled. Set
          <code>browser.harness.enabled</code> to <code>true</code> in
          about:config and reload this page.
        </p>
      </section>
      <pre id="output" tabindex="0" aria-live="polite"></pre>
      <form id="input-row">
        <span class="prompt" aria-hidden="true">$</span>
        <input
          id="command"
          autocomplete="off"
          placeholder="console shell (interactive, no structure)"
          aria-label="Shell command"
          disabled
        />
      </form>
      <form id="exec-row">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input
          id="exec-command"
          autocomplete="off"
          placeholder="agent exec (structured, runs in /workspace)"
          aria-label="Agent exec command"
          disabled
        />
        <button id="exec-run" disabled>Exec</button>
      </form>
    </main>
  </body>
</html>

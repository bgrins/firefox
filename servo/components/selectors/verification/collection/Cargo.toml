[package]
name = "stylo-collection-verification"
version = "0.1.0"
publish = false
authors = ["The Servo Project Developers"]
documentation = "https://docs.rs/selectors/"
description = "CSS Selectors matching for Rust"
repository = "https://github.com/servo/stylo"
keywords = ["css", "selectors"]
license = "MPL-2.0"
edition = "2024"

[lib]
name = "selectors"
path = "lib.rs"
test = false
doctest = false

[features]
bench = []
to_shmem = ["dep:to_shmem", "dep:to_shmem_derive"]

[dependencies]
bitflags = "2"
cssparser = "0.38"
derive_more = { version = "2", features = ["add", "add_assign"] }
hashbrown = "0.17"
rustc-hash = "2.1.1"
log = "0.4"
precomputed-hash = "0.1"
servo_arc = { version = "0.4", path = "../../../servo_arc" }
smallvec = "1.0"
to_shmem = { version = "0.1", path = "../../../to_shmem", features = ["servo_arc"], optional = true }
to_shmem_derive = { version = "0.1", path = "../../../to_shmem_derive", optional = true }
new_debug_unreachable = "1"

[workspace]

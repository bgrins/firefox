<!doctype html>
<meta charset="utf-8">
<title>Scoped :has() matching distinguishes overlapping scoping roots</title>
<link rel="help" href="https://drafts.csswg.org/css-cascade-6/#scoped-style-rules">
<link rel="help" href="https://drafts.csswg.org/css-cascade-6/#scope-limits">
<link rel="help" href="https://drafts.csswg.org/selectors-4/#relational">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
const selector = '.lim:has(> .trigger:not(:scope > .lim > .trigger)) #target';
const variants = [
  ['overlapping roots', `@scope (.o) { ${selector} { z-index: 1 } }`, '1'],
  ['outer-first root list', `@scope (#outer, #inner) { ${selector} { z-index: 1 } }`, '1'],
  ['inner-first root list', `@scope (#inner, #outer) { ${selector} { z-index: 1 } }`, '1'],
  [':where() roots', `@scope (:where(.o)) { ${selector} { z-index: 1 } }`, '1'],
  [':is() in relative selector', `@scope (.o) {
    .lim:has(> :is(.trigger:not(:scope > .lim > .trigger))) #target { z-index: 1 }
  }`, '1'],
  [':where() in relative selector', `@scope (.o) {
    .lim:has(> :where(.trigger:not(:scope > .lim > .trigger))) #target { z-index: 1 }
  }`, '1'],
  ['nesting selector', `@scope (.o) {
    .lim:has(> .trigger:not(& > .lim > .trigger)) #target { z-index: 1 }
  }`, '1'],
  ['separate scope rules', `
    @scope (#outer) { ${selector} { z-index: 1 } }
    @scope (#inner) { ${selector} { z-index: 1 } }
  `, '1'],
  ['outer root only', `@scope (#outer) { ${selector} { z-index: 1 } }`, '1'],
  ['inner root only', `@scope (#inner) { ${selector} { z-index: 1 } }`, '0'],
  ['scope-independent match', '@scope (.o) { .lim:has(> .trigger) #target { z-index: 1 } }', '1'],
  ['scope-independent nonmatch', '@scope (.o) { .lim:has(> .missing) #target { z-index: 1 } }', '0'],
  ['scope-dependent limit', `
    @scope (.o) to (.lim:has(> .trigger:not(:scope > .lim > .trigger))) {
      #target { z-index: 1 }
    }
  `, '1'],
];
const markup = `
  <div class="o" id="outer">
    <div class="o" id="inner">
      <div class="lim"><i class="trigger"></i><span id="target"></span></div>
    </div>
  </div>
`;
for (const [label, rules, expected] of variants) {
  promise_test(async t => {
    const frame = document.createElement('iframe');
    t.add_cleanup(() => frame.remove());
    const loaded = new Promise(resolve => frame.onload = resolve);
    frame.srcdoc = '<!doctype html><style>#target { z-index: 0 }' + rules + '</style>' + markup;
    document.body.append(frame);
    await loaded;
    const target = frame.contentDocument.getElementById('target');
    assert_equals(frame.contentWindow.getComputedStyle(target).zIndex, expected);
  }, 'Scope-sensitive :has(): ' + label);
}
</script>

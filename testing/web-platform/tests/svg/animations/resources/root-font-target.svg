<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <style>
    :root { font-size: 23px; line-height: 37px; }
    #child, #nested { font-size: 11px; }
    #clock { opacity: 1; }
  </style>
  <g id="child"><text x="0" y="30">Child</text></g>
  <svg id="nested" x="0" y="40" width="100" height="40">
    <text x="0" y="20">Nested</text>
  </svg>
  <rect id="clock" width="10" height="10"/>
</svg>

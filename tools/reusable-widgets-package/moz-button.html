<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
</head>
<body>
    <h1>Test moz-button Component</h1>
    
    <section class="component-section">
        <h2 class="component-title">moz-button</h2>
        <div class="example-group">
            <div class="example-title">Button Types</div>
            <moz-button type="primary">Primary Button</moz-button>
            <moz-button type="secondary">Secondary Button</moz-button>
            <moz-button type="danger">Danger Button</moz-button>
            <moz-button type="icon" icon="chrome://global/skin/icons/edit.svg" aria-label="Edit"></moz-button>
        </div>
        <div class="example-group">
            <div class="example-title">Button Sizes</div>
            <moz-button size="small">Small</moz-button>
            <moz-button size="default">Default</moz-button>
            <moz-button size="large">Large</moz-button>
        </div>
        <div class="example-group">
            <div class="example-title">Disabled State</div>
            <moz-button disabled>Disabled Button</moz-button>
        </div>
    </section>
    
    <script type="module">
        import './moz-button/moz-button.mjs';
        console.log('moz-button component loaded');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moz-label Web Component Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .demo-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        h2 {
            margin-top: 0;
        }
        .control-group {
            margin: 15px 0;
        }
        input[type="text"], input[type="email"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>moz-label Component Demo</h1>
    
    <div class="demo-section">
        <h2>Basic Label with Accesskey</h2>
        <div class="control-group">
            <label is="moz-label" accesskey="n" for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div class="control-group">
            <label is="moz-label" accesskey="e" for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <p><small>Press Alt+N or Alt+E (Cmd on Mac) to focus the fields</small></p>
    </div>

    <div class="demo-section">
        <h2>Checkbox with Label</h2>
        <div class="control-group">
            <label is="moz-label" accesskey="a" for="agree">
                <input type="checkbox" id="agree">
                I agree to the terms
            </label>
        </div>
    </div>

    <div class="demo-section">
        <h2>Radio Buttons</h2>
        <div class="control-group">
            <label is="moz-label" accesskey="1" for="option1">
                <input type="radio" id="option1" name="options">
                Option 1
            </label>
        </div>
        <div class="control-group">
            <label is="moz-label" accesskey="2" for="option2">
                <input type="radio" id="option2" name="options">
                Option 2
            </label>
        </div>
    </div>

    <div class="demo-section">
        <h2>Accesskey Not in Text</h2>
        <div class="control-group">
            <label is="moz-label" accesskey="x" for="field">Field Label:</label>
            <input type="text" id="field">
        </div>
        <p><small>When accesskey 'X' is not in the label text, it's appended in parentheses</small></p>
    </div>

    <script type="module">
        import './dist/components/moz-label.mjs';
        console.log('moz-label component loaded');
    </script>
</body>
</html>
